name: Reconcile Dependency Lockfiles

on:
  push:
    branches:
      - architecture-rebuild
    paths:
      - ".github/workflows/reconcile-lockfiles.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: architecture-rebuild

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Reconcile server lockfile
        working-directory: server
        run: npm install --package-lock-only --ignore-scripts

      - name: Reconcile client lockfile
        working-directory: client
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit reconciled lockfiles
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- server/package-lock.json client/package-lock.json; then
            echo "Lockfiles already match package manifests."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/package-lock.json client/package-lock.json
          git commit -m "chore: reconcile dependency lockfiles"
          git push origin HEAD:architecture-rebuild
