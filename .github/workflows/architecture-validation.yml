name: Architecture Validation

on:
  push:
    branches:
      - architecture-rebuild
    paths:
      - "server/**"
      - "client/**"
      - ".github/workflows/architecture-validation.yml"
  workflow_dispatch:

jobs:
  server-contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tripdash
          POSTGRES_PASSWORD: tripdash
          POSTGRES_DB: tripdash_control_validation
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U tripdash -d tripdash_control_validation"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgresql://tripdash:tripdash@localhost:5432/tripdash_control_validation?schema=primary_validation
      DIRECT_URL: postgresql://tripdash:tripdash@localhost:5432/tripdash_control_validation?schema=primary_validation
      CONTROL_DATABASE_URL: postgresql://tripdash:tripdash@localhost:5432/tripdash_control_validation?schema=public
      OPERATIONAL_DATABASE_URL: postgresql://tripdash:tripdash@localhost:5432/tripdash_control_validation?schema=operational_validation
      CONTROL_DATABASE_SMOKE: "true"
      JWT_SECRET: architecture-validation-only-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      # The server lockfile predates several rebuild dependencies and will be
      # reconciled separately. Keep this explicit until npm ci becomes a gate.
      - name: Install server dependencies
        run: npm install --ignore-scripts

      - name: Validate all Prisma schemas
        run: npm run prisma:validate

      - name: Generate all Prisma clients
        run: npm run prisma:generate

      - name: Create disposable canonical control-plane schema
        run: npx prisma db push --schema prisma/control.schema.prisma --skip-generate

      - name: Test canonical access policy and real database rehearsal
        run: npm run test:access

  client-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      # The client lockfile is currently stale (MSAL/Recharts entries are
      # missing). Use install temporarily so we can still compile the rebuilt
      # UI. Restoring npm ci remains a separate readiness gate.
      - name: Install client dependencies
        run: npm install --ignore-scripts

      - name: Build React application
        run: npm run build
