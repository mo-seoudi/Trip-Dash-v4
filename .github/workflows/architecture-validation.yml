name: Architecture Validation

on:
  push:
    branches:
      - architecture-rebuild
    paths:
      - "server/**"
      - "client/**"
      - ".github/workflows/architecture-validation.yml"
  workflow_dispatch:

jobs:
  server-contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tripdash
          POSTGRES_PASSWORD: tripdash
          POSTGRES_DB: tripdash_control_validation
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U tripdash -d tripdash_control_validation"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        working-directory: server
    env:
      CONTROL_DATABASE_URL: postgresql://tripdash:tripdash@localhost:5432/tripdash_control_validation?schema=control
      OPERATIONAL_DATABASE_URL: postgresql://tripdash:tripdash@localhost:5432/tripdash_control_validation?schema=operational_validation
      CONTROL_DATABASE_SMOKE: "true"
      OPERATIONAL_DATABASE_SMOKE: "true"
      JWT_SECRET: architecture-validation-only-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Validate canonical Prisma schemas
        run: npm run prisma:validate

      - name: Generate canonical Prisma clients
        run: npm run prisma:generate

      - name: Create disposable control-plane schema
        run: npx prisma db push --schema prisma/control.schema.prisma --skip-generate

      - name: Create disposable operational schema
        run: npx prisma db push --schema prisma/operational.schema.prisma --skip-generate

      - name: Test canonical access and operational database contracts
        run: npm run test:access

      - name: Run operational database invariants
        run: npm run test:operational:smoke

      - name: Smoke test live server startup
        shell: bash
        run: |
          set -euo pipefail
          PORT=5050 node src/index.js > /tmp/tripdash-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:5050/health > /dev/null; then
              exit 0
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat /tmp/tripdash-server.log
              exit 1
            fi
            sleep 0.5
          done

          cat /tmp/tripdash-server.log
          echo "Server did not become healthy in time"
          exit 1

  client-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Build React application
        run: npm run build
